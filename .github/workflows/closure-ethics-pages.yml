name: Deploy Closure Ethics site to GitHub Pages

on:
  push:
    branches:
      - closure-ethics
    paths:
      - 'closure-ethics/docs/**'
      - 'closure-ethics/09-implementation/**'
      - 'closure-ethics/11-communication/**'
      - 'closure-ethics/12-standard/**'
      - '.github/workflows/closure-ethics-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Build publication PDF
        run: python closure-ethics/09-implementation/build_pdf.py

      - name: Verify generated PDF
        run: test -s closure-ethics/docs/downloads/Closure_Ethics_Implementation_Spec_v0.1.pdf

      - name: Open external links in new tabs
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re

          root = pathlib.Path('closure-ethics/docs')
          internal_prefix = 'https://marekzajda.github.io/5D_6D-theory-of-entropic-gravity/'
          anchor_re = re.compile(r'<a\b(?P<attrs>[^>]*\bhref=(?P<q>["\'])(?P<href>https?://[^"\']+)(?P=q)[^>]*)>', re.IGNORECASE)

          def rewrite(match):
              attrs = match.group('attrs')
              href = match.group('href')
              if href.startswith(internal_prefix):
                  return match.group(0)
              if re.search(r'\btarget\s*=', attrs, re.IGNORECASE):
                  return match.group(0)
              additions = ' target="_blank"'
              if not re.search(r'\brel\s*=', attrs, re.IGNORECASE):
                  additions += ' rel="noopener noreferrer"'
              return '<a' + attrs + additions + '>'

          changed = 0
          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = anchor_re.sub(rewrite, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          print(f'Updated external links in {changed} HTML file(s).')
          PY

      - name: Generate public build provenance and SHA-256 manifest
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('closure-ethics/docs')
          payload = {
              'project': 'Closure Ethics for Autonomous Agents',
              'project_signature': 'Project Möbia and Marek Zajda',
              'repository': 'marekzajda/5D_6D-theory-of-entropic-gravity',
              'branch': os.environ['BUILD_REF'],
              'commit_sha': os.environ['BUILD_SHA'],
              'github_run_id': os.environ['BUILD_RUN_ID'],
              'note': 'Generated by the GitHub Pages deployment workflow. Verify file hashes against SHA256SUMS.txt and trace this build to the listed commit.'
          }
          (root / 'provenance.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          cd closure-ethics/docs
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: closure-ethics/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
