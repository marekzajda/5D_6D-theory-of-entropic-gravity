name: Redirect legacy Closure Ethics site

on:
  push:
    branches:
      - closure-ethics
    paths:
      - '.github/workflows/closure-ethics-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build legacy redirect site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p redirect-site
          cat > redirect-site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Closure Ethics has moved</title>
            <meta name="robots" content="noindex,follow">
            <link rel="canonical" href="https://marekzajda.github.io/closure-ethics-for-autonomous-ai-agents/">
            <meta http-equiv="refresh" content="0; url=https://marekzajda.github.io/closure-ethics-for-autonomous-ai-agents/">
          </head>
          <body>
            <main>
              <h1>Closure Ethics has moved</h1>
              <p>The canonical project is now available at
                <a href="https://marekzajda.github.io/closure-ethics-for-autonomous-ai-agents/">marekzajda.github.io/closure-ethics-for-autonomous-ai-agents/</a>.
              </p>
            </main>
            <script>location.replace('https://marekzajda.github.io/closure-ethics-for-autonomous-ai-agents/' + location.search + location.hash);</script>
          </body>
          </html>
          HTML

          cat > redirect-site/404.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Closure Ethics has moved</title>
            <meta name="robots" content="noindex,follow">
            <link rel="canonical" href="https://marekzajda.github.io/closure-ethics-for-autonomous-ai-agents/">
          </head>
          <body>
            <main>
              <h1>Closure Ethics has moved</h1>
              <p><a id="destination" href="https://marekzajda.github.io/closure-ethics-for-autonomous-ai-agents/">Continue to the canonical site</a>.</p>
            </main>
            <script>
              (function () {
                var legacyPrefix = '/5D_6D-theory-of-entropic-gravity/';
                var newBase = 'https://marekzajda.github.io/closure-ethics-for-autonomous-ai-agents/';
                var path = location.pathname;
                var relative = path.indexOf(legacyPrefix) === 0 ? path.slice(legacyPrefix.length) : '';
                var target = newBase + relative + location.search + location.hash;
                document.getElementById('destination').href = target;
                location.replace(target);
              }());
            </script>
          </body>
          </html>
          HTML

          touch redirect-site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v4
        with:
          path: redirect-site

      - name: Deploy legacy redirect
        id: deployment
        uses: actions/deploy-pages@v4
