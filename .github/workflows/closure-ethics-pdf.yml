name: Build Closure Ethics implementation PDF

on:
  push:
    branches:
      - closure-ethics
      - ce-pdf-complete-v01
    paths:
      - 'closure-ethics/09-implementation/**'
      - 'closure-ethics/11-communication/**'
      - 'closure-ethics/12-standard/**'
      - '.github/workflows/closure-ethics-pdf.yml'
  pull_request:
    branches:
      - closure-ethics
    paths:
      - 'closure-ethics/09-implementation/**'
      - 'closure-ethics/11-communication/**'
      - 'closure-ethics/12-standard/**'
      - '.github/workflows/closure-ethics-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: closure-ethics-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    name: Build Closure Ethics PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Run Closure Ethics governor tests
        working-directory: closure-ethics/09-implementation
        run: python -m unittest -v test_reference.py

      - name: Run Universal Closure Protocol tests
        working-directory: closure-ethics/11-communication
        run: python -m unittest -v test_closure_protocol.py

      - name: Build PDF
        run: python closure-ethics/09-implementation/build_pdf.py

      - name: Verify generated PDF
        run: test -s closure-ethics/docs/downloads/Closure_Ethics_Implementation_Spec_v0.1.pdf

      - name: Commit generated PDF on temporary feature branch
        if: github.ref_name == 'ce-pdf-complete-v01'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add closure-ethics/docs/downloads/Closure_Ethics_Implementation_Spec_v0.1.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Update complete Closure Ethics v0.1 PDF"
            git push origin HEAD:ce-pdf-complete-v01
          fi
