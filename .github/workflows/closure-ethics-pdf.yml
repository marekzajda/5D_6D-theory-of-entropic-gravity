name: Build Closure Ethics implementation PDF

on:
  push:
    branches:
      - closure-ethics
    paths:
      - 'closure-ethics/09-implementation/**'
      - 'closure-ethics/11-communication/**'
      - 'closure-ethics/12-standard/**'
      - '.github/workflows/closure-ethics-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: closure-ethics-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: closure-ethics

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Run reference tests
        working-directory: closure-ethics/09-implementation
        run: python -m unittest -v test_reference.py

      - name: Build PDF
        run: python closure-ethics/09-implementation/build_pdf.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add closure-ethics/docs/downloads/Closure_Ethics_Implementation_Spec_v0.1.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build Closure Ethics implementation PDF"
            git pull --rebase origin closure-ethics
            git push origin closure-ethics
          fi
